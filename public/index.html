<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HourHive Caseload</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>

<div id="authScreen" class="auth-screen">
  <div class="auth-card">
    <div class="brand-lockup">
      <svg class="hive-mark" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M24 2 L44 13 V35 L24 46 L4 35 V13 Z" stroke="var(--amber)" stroke-width="2.5"/>
        <path d="M24 12 L34 18 V30 L24 36 L14 30 V18 Z" fill="var(--amber)"/>
      </svg>
      <div>
        <div class="brand-name">HourHive <span class="brand-suffix">Caseload</span></div>
        <div class="brand-tagline">Service-minute scheduling for Para Instructors</div>
      </div>
    </div>

    <div id="loginForm">
      <h2>Sign in</h2>
      <label>Email
        <input type="email" id="loginEmail" placeholder="admin@yourdistrict.org" />
      </label>
      <label>Password
        <input type="password" id="loginPassword" placeholder="••••••••" />
      </label>
      <button class="btn-primary" id="loginBtn">Sign in</button>
      <p class="auth-switch">New district? <a href="#" id="showRegister">Create an account</a></p>
      <p class="auth-hint">Demo login: admin@demo-school.org / demo1234</p>
      <p class="auth-error" id="loginError"></p>
    </div>

    <div id="registerForm" class="hidden">
      <h2>Set up your district</h2>
      <label>District / Organization name
        <input type="text" id="regOrg" placeholder="Sunrise Unified School District" />
      </label>
      <label>Your name
        <input type="text" id="regName" placeholder="Jordan Casey" />
      </label>
      <label>Email
        <input type="email" id="regEmail" placeholder="you@yourdistrict.org" />
      </label>
      <label>Password
        <input type="password" id="regPassword" placeholder="••••••••" />
      </label>
      <button class="btn-primary" id="registerBtn">Create account</button>
      <p class="auth-switch">Already set up? <a href="#" id="showLogin">Sign in</a></p>
      <p class="auth-error" id="registerError"></p>
    </div>
  </div>
</div>

<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="brand-lockup small">
      <svg class="hive-mark" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M24 2 L44 13 V35 L24 46 L4 35 V13 Z" stroke="var(--amber)" stroke-width="2.5"/>
        <path d="M24 12 L34 18 V30 L24 36 L14 30 V18 Z" fill="var(--amber)"/>
      </svg>
      <div>
        <div class="brand-name small">HourHive <span class="brand-suffix">Caseload</span></div>
      </div>
    </div>
    <nav class="nav">
      <button class="nav-item active" data-view="dashboard">Overview</button>
      <button class="nav-item" data-view="paras">Para Instructors</button>
      <button class="nav-item" data-view="students">Students</button>
      <button class="nav-item" data-view="caseloads">Caseloads</button>
      <button class="nav-item" data-view="schedule">Schedule</button>
      <button class="nav-item" data-view="admin">Admin Report</button>
    </nav>
    <div class="sidebar-footer">
      <div class="org-name" id="orgUserLabel"></div>
      <button class="btn-ghost" id="logoutBtn">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <h1 id="viewTitle">Overview</h1>
      <div class="topbar-actions" id="topbarActions"></div>
    </header>
    <section class="content" id="content"></section>
  </main>
</div>

<div id="toast" class="toast hidden"></div>

<script src="/js/app.js"></script>
</body>
</html>
